[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessiongauge"
version = "0.1.0"
description = "Read-only local Hermes session usage monitor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sessiongauge = "sessiongauge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sessiongauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
