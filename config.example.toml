# ~/.config/sessiongauge/config.toml に必要な設定だけをコピーしてください。

# Hermes state.db のパスを複数指定できます。省略時はHERMES_HOMEと既定profileを検出します。
# hermes_db_paths = ["~/.hermes/state.db", "~/.hermes/profiles/work/state.db"]

# 独自監視DBの保存場所
# data_dir = "~/.local/share/sessiongauge"

# ポーリング間隔（秒）。2〜60。既定値は3。
# poll_interval_seconds = 3

# IANAタイムゾーン名、または "local"
# time_zone = "local"

[sidebar]
# サイドバー報告は既定で無効。利用者が有効化した場合だけherdrへメタデータを送ります。
enabled = false
display = "percent"
# 推定割合とコンパクトなtoken数を表示する場合:
# display = "percent_tokens"
ttl_ms = 15000

# 任意。割合の取得・推定機能（quota自体は既定無効）
[sidebar.quota]
enabled = false
# estimate（既定）または従来のAPI実測を表示する api
mode = "estimate"
estimate_max_age_seconds = 86400
agent_resume_bin = "agent-resume"
hermes_home = "~/.hermes"
hermes_root = "~/.hermes/hermes-agent"
# 必要な場合のみ指定（既定: <hermes_root>/venv/bin/python）
# hermes_python = "/path/to/hermes-agent/venv/bin/python"
# auth_helper = "/path/to/agent-resume/adapters/hermes_bridge.py"
poll_interval_seconds = 60

# herdrの表示設定は利用者が明示的に設定します。SessionGaugeは設定ファイルを書き換えません。
# herdrの設定に次の例を追加すると、対応するpaneに専用tokenを表示できます。
# [ui.sidebar.agents.rows_by_agent]
# hermes = [["state_icon", "machine", "workspace", "tab"], ["agent", "$sessiongauge_usage"]]
